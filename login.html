<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/Vision-Books-And-Uniform-/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up – Visionbooks & Uniform</title>
    <meta name="description" content="Sign in or create an account at Visionbooks & Uniform to manage your orders, wishlist, and profile.">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a3c5e 0%, #0d1b2a 50%, #1a3c5e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 450px;
        }

        .auth-logo {
            text-align: center;
            color: white;
        }

        .auth-logo .logo-icon-large {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #d4893f, #e6a55a);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.8rem;
            color: white;
        }

        .auth-logo h1 {
            font-size: 1.5rem;
            color: white;
            margin: 0 0 4px;
            font-family: 'Poppins', sans-serif;
        }

        .auth-logo p {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            margin: 0;
        }

        .auth-container {
            width: 100%;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 8px;
            color: #1a3c5e;
            font-size: 1.7rem;
            font-family: 'Poppins', sans-serif;
        }

        .auth-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 15px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .auth-input:focus {
            outline: none;
            border-color: #1a3c5e;
            box-shadow: 0 0 0 4px rgba(26, 60, 94, 0.1);
        }

        .auth-input.error {
            border-color: #dc3545;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            text-align: left;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .password-strength {
            height: 4px;
            background: #e5e5e5;
            border-radius: 2px;
            margin-bottom: 15px;
            overflow: hidden;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
            border-radius: 2px;
        }

        .password-strength-bar.weak { width: 33%; background: #dc3545; }
        .password-strength-bar.medium { width: 66%; background: #ffc107; }
        .password-strength-bar.strong { width: 100%; background: #28a745; }

        .auth-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-auth {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login {
            background: linear-gradient(135deg, #1a3c5e, #2a5a8c);
            color: white;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #15324f, #1e4670);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(26, 60, 94, 0.3);
        }

        .btn-signup {
            background: transparent;
            border: 2px solid #1a3c5e;
            color: #1a3c5e;
        }

        .btn-signup:hover {
            background: #1a3c5e;
            color: white;
            transform: translateY(-2px);
        }

        .btn-auth:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-auth .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        .btn-auth.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }

        .divider span {
            padding: 0 15px;
            color: #999;
            font-size: 13px;
        }

        .forgot-password {
            display: block;
            margin-top: 15px;
            color: #1a3c5e;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: #d4893f;
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }

        .btn-logout-link {
            background: none;
            border: 2px solid #e5e5e5;
            color: #666;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
        }

        .btn-logout-link:hover {
            border-color: #dc3545;
            color: #dc3545;
        }

        /* Password Reset Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal h3 {
            margin-bottom: 15px;
            color: #1a3c5e;
            font-family: 'Poppins', sans-serif;
        }

        .modal p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-modal {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
        }

        .btn-modal-primary {
            background: linear-gradient(135deg, #1a3c5e, #2a5a8c);
            color: white;
        }

        .btn-modal-primary:hover {
            transform: translateY(-1px);
        }

        .btn-modal-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-modal-secondary:hover {
            background: #e5e5e5;
        }

        /* Toast - login page specific override */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
        }

        .toast-success { background: #28a745; }
        .toast-error { background: #dc3545; }
        .toast-info { background: #17a2b8; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 24px;
            }
            .auth-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="auth-wrapper">
        <div class="auth-logo">
            <div class="logo-icon-large"><i class="fas fa-book-open"></i></div>
            <h1>Visionbooks & Uniform</h1>
            <p>Books · Stationery · Gifts · Uniforms</p>
        </div>

        <div class="auth-container">
            <h2 id="authTitle">Welcome Back</h2>
            <p class="auth-subtitle" id="authSubtitle">Sign in to your account to continue</p>

            <input type="email" id="emailInput" class="auth-input" placeholder="Email Address">
            <div class="error-message" id="emailError">Please enter a valid email address</div>

            <input type="password" id="passwordInput" class="auth-input" placeholder="Password">
            <div class="error-message" id="passwordError">Password is required</div>

            <div class="password-strength" id="passwordStrength">
                <div class="password-strength-bar" id="strengthBar"></div>
            </div>

            <div class="auth-buttons">
                <button class="btn-auth btn-login" id="authLoginBtn" onclick="handleLogin()">
                    <span class="spinner"></span>
                    <span id="authLoginBtnText">Log In</span>
                </button>
                <button class="btn-auth btn-signup" id="authSignupBtn" onclick="handleSignup()">
                    <span class="spinner"></span>
                    <span id="authSignupBtnText">Sign Up</span>
                </button>
            </div>

            <a class="forgot-password" id="forgotPasswordLink" onclick="showPasswordResetModal()">Forgot Password?</a>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="btn-logout-link" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i> Log Out (if already logged in)
            </button>
        </div>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- Password Reset Modal -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal">
            <h3>Reset Password</h3>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <input type="email" id="resetEmailInput" class="auth-input" placeholder="Email Address">
            <div class="modal-buttons">
                <button class="btn-modal btn-modal-secondary" onclick="closePasswordResetModal()">Cancel</button>
                <button class="btn-modal btn-modal-primary" onclick="submitPasswordReset()">Send Reset Link</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module" src="js/firebase-client.js"></script>
    <script type="module" src="js/auth.js"></script>

    <!-- Form Logic -->
    <script type="module">
        // Check if user is admin (UID exists in the 'admins' Firestore collection)
        async function isAdmin(uid) {
            try {
                const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js");
                const snap = await getDoc(doc(window.firebaseDb, 'admins', uid));
                return snap.exists();
            } catch (e) {
                return false;
            }
        }

        async function redirectAfterAuth(user) {
            const admin = await isAdmin(user.uid);
            window.location.href = admin ? 'admin.html' : 'my-account.html';
        }

        function getInputs() {
            return {
                email: document.getElementById('emailInput').value.trim(),
                password: document.getElementById('passwordInput').value
            };
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePassword(password, isSignup = false) {
            if (isSignup) {
                if (password.length < 6) return 'Password must be at least 6 characters';
            }
            return null;
        }

        function showError(inputId, errorId, message) {
            const input = document.getElementById(inputId);
            const error = document.getElementById(errorId);
            input.classList.add('error');
            error.textContent = message;
            error.classList.add('show');
        }

        function clearErrors() {
            ['emailInput', 'passwordInput'].forEach(id => {
                document.getElementById(id).classList.remove('error');
            });
            ['emailError', 'passwordError'].forEach(id => {
                document.getElementById(id).classList.remove('show');
            });
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (loading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Password strength indicator
        document.getElementById('passwordInput').addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            const strengthBar = document.getElementById('strengthBar');
            
            if (password.length === 0) {
                strengthDiv.classList.remove('show');
                return;
            }
            
            strengthDiv.classList.add('show');
            strengthBar.className = 'password-strength-bar';
            
            if (password.length < 6) {
                strengthBar.classList.add('weak');
            } else if (password.length < 10 || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
                strengthBar.classList.add('medium');
            } else {
                strengthBar.classList.add('strong');
            }
        });

        async function handleLogin() {
            const { email, password } = getInputs();
            clearErrors();

            if (!email) {
                showError('emailInput', 'emailError', 'Please enter your email address');
                return;
            }
            if (!validateEmail(email)) {
                showError('emailInput', 'emailError', 'Please enter a valid email address');
                return;
            }
            if (!password) {
                showError('passwordInput', 'passwordError', 'Please enter your password');
                return;
            }

            setLoading('authLoginBtn', true);
            const user = await window.logInUser(email, password);
            setLoading('authLoginBtn', false);

            if (user) {
                await redirectAfterAuth(user);
            }
        }

        async function handleSignup() {
            const { email, password } = getInputs();
            clearErrors();

            if (!email) {
                showError('emailInput', 'emailError', 'Please enter your email address');
                return;
            }
            if (!validateEmail(email)) {
                showError('emailInput', 'emailError', 'Please enter a valid email address');
                return;
            }

            const passwordError = validatePassword(password, true);
            if (passwordError) {
                showError('passwordInput', 'passwordError', passwordError);
                return;
            }

            setLoading('authSignupBtn', true);
            const user = await window.signUpUser(email, password);
            setLoading('authSignupBtn', false);

            if (user) {
                await redirectAfterAuth(user);
            }
        }

        async function handleLogout() {
            if (window.currentUser) {
                await window.logOutUser();
            }
        }

        // Password Reset Modal
        function showPasswordResetModal() {
            const email = window.currentUser?.email || '';
            document.getElementById('resetEmailInput').value = email;
            document.getElementById('resetModal').classList.add('show');
        }

        function closePasswordResetModal() {
            document.getElementById('resetModal').classList.remove('show');
        }

        async function submitPasswordReset() {
            const email = document.getElementById('resetEmailInput').value.trim();
            if (!email || !validateEmail(email)) {
                alert('Please enter a valid email address');
                return;
            }

            const btn = document.querySelector('.btn-modal-primary');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            const success = await window.resetPassword(email);

            btn.disabled = false;
            btn.textContent = 'Send Reset Link';

            if (success) {
                closePasswordResetModal();
            }
        }

        // Close modal on outside click
        document.getElementById('resetModal').addEventListener('click', function(e) {
            if (e.target === this) closePasswordResetModal();
        });

        // Expose functions to global scope
        window.handleLogin = handleLogin;
        window.handleSignup = handleSignup;
        window.handleLogout = handleLogout;
        window.showPasswordResetModal = showPasswordResetModal;
        window.closePasswordResetModal = closePasswordResetModal;
        window.submitPasswordReset = submitPasswordReset;

        // Toast function for login page (since utils.js is not loaded here)
        if (typeof showToast === 'undefined') {
            window.showToast = function(message, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
                toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    toast.style.transition = 'all 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            };
        }
    </script>
</body>

</html>
